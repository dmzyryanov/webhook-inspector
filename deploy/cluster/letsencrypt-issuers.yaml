# Let's Encrypt issuers for the cluster.
#
# Applied once as a cluster prerequisite, after replacing the placeholder
# contact address acme-contact@example.com in both issuers with the address
# Let's Encrypt should write to about the certificates (#367). Let's Encrypt
# refuses example.com, so an issuer left with the placeholder never becomes
# ready and no certificate is issued:
#
#   kubectl apply -f deploy/cluster/letsencrypt-issuers.yaml
#
# The project's own server applies its operator's copy, which holds that
# operator's address and is kept outside this repository.
#
# Two issuers exist so that a certificate can be proved end to end against the
# staging endpoint before the production one is asked for anything. Production
# refuses roughly five failed authorisations an hour and five certificates per
# domain a week, and a misconfigured challenge burns that allowance quickly;
# staging has no comparable limit, and its certificate is untrusted by browsers
# but identical in every step needed to obtain it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: acme-contact@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme-contact@example.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
