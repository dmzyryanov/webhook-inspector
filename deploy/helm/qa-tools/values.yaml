# Values for the Webhook Inspector chart. They name no installation: the
# hosts and the registry are the installer's, and the backup's off-server copy
# and the monitor are off until configured (#367). README.md, "Installing on
# k3s with the chart", lists what to set. Install into its own namespace:
#   helm upgrade --install inspector deploy/helm/qa-tools \
#     --namespace inspector --create-namespace \
#     --set-string images.registry=<registry-host/namespace/project> \
#     --set-string images.tag=<commit-sha> \
#     --set-string ingress.host=<the site's host> \
#     --set-string receive.host=<the receive host>
#
# The project's own production is one such installation: its deploy job in
# .gitlab-ci.yml passes its values from the project's CI/CD variables, which
# its operator keeps outside this repository.

images:
  # The registry and path holding the backend, frontend and postgres images,
  # which the installer builds and pushes (README.md). No default: the chart
  # refuses to render without it. CI passes CI_REGISTRY_IMAGE, the project's
  # own registry.
  registry: ''
  # Applied to the frontend and backend images, and set by CI to the commit SHA
  # so a release names exactly the code it deploys (D022). There is no default:
  # a missing tag must fail the install rather than silently deploy something
  # else.
  tag: ''
  backend: backend
  frontend: frontend
  # Credentials for the private Container Registry, created from a deploy
  # token with read_registry scope, of the project or of its group.
  pullSecret: gitlab-registry

# ingress.host is the site's host, and receive.host below the receive host's:
# no defaults, and the chart refuses to render without both, naming them. The
# deploy job sets them from its origins (D274, #367).
ingress:
  host: ''
  # The site's second host (#319, D275): the same site, API, WebSocket and MCP
  # server on two Ingresses of their own, templates/ingress.yaml, every answer
  # carrying X-Robots-Tag: noindex. Empty, the default, there is none, and no
  # certificate is asked for one.
  aliasHost: ''
  className: traefik
  tls:
    enabled: true
    # The site's certificate, a Secret cert-manager keeps; empty is
    # <release>-tls.
    secretName: ''
    # The second host's certificate, a Secret of its own that cert-manager
    # issues for that host alone, so the first host's is not reissued for it;
    # empty is <release>-alias-tls.
    aliasSecretName: ''
    # letsencrypt-staging exists for proving a change to the challenge path
    # without spending the production allowance; production was reached only
    # after staging issued a certificate for this host
    # (deploy/cluster/letsencrypt-issuers.yaml).
    issuer: letsencrypt-production
  # No proxy-level body limit: Traefik streams a request body instead of
  # buffering it, so the application stays the only thing that decides what is
  # too large, and every oversized body receives the documented error rather
  # than the proxy's own answer (D008, D089).
  #
  # The edge rate limit on the API's two paths, /api/ and /mcp, and on nothing
  # else (#205, D264): Traefik's rateLimit middleware, a token bucket per
  # client address Traefik sees - an IPv6 address by its /64 - refilled at
  # `average` calls per `period` and holding at most `burst`; past it Traefik
  # answers 429 itself, before the call reaches the backend. Far above the
  # backend's own limits (D201): one address gets at most 60 + 1200 calls a
  # minute through them, 21 a second, and twice that within seconds across a
  # window's edge, twice again during a deployment's overlap (D221) - 5,040
  # at once and 42 a second at the very most - so a client within them never
  # meets the edge, and only a flood far beyond them does.
  # scripts/chart.test.mjs holds the numbers above that bound and equal to the
  # measurement's (scripts/measure-connections.traefik.yml). `average: 0`
  # turns the limit off, Traefik's own meaning of 0: the one-line recovery,
  # which every check passes on, and which must be set before the Traefik
  # Service's externalTrafficPolicy goes back to Cluster, where every sender
  # reaches Traefik from one address and would share one bucket (section 7 of
  # the operator's runbook for that policy, kept outside this repository).
  apiRateLimit:
    average: 100
    period: 1s
    burst: 6000

# The receive host (D187): webhooks are received on a host of their own,
# through a Traefik TCP route that terminates TLS and hands the sender's bytes
# to the backend's receive listener unchanged, behind a PROXY protocol v2
# header carrying the sender's address. Traefik's HTTP layer, which rewrote
# header names, order and paths (D091, D144, D173), is not on this path.
# The host needs a DNS record of its own pointing at the server, as the
# site's does. No default; the deploy job sets it from its receive origin
# (D274, #367).
receive:
  host: ''
  # The backend's second listener, and the Service port of the same name.
  port: 3001
  # v2: Traefik's transport sends a PROXY protocol v2 header in front of every
  # connection, and the backend accepts a connection only with one, from a
  # peer in backend.trustedProxyCidrs, which it refuses to start without.
  # `off` turns it off at both ends, and every capture then stores the Traefik
  # pod's address as its sender: a fallback, never a configuration (runbook
  # section 7).
  proxyProtocol: v2
  # The Secret cert-manager keeps the host's certificate in, through the
  # chart's Certificate (templates/receive.yaml); empty is <release>-receive-tls.
  tlsSecretName: ''
  # At most this many connections open at once from one sender address to the
  # receive host (D227, issue #145), counted by the backend's PROXY protocol
  # layer from the address the header carries - an IPv6 address by its /64 -
  # from the moment the header is read until the connection closes, an idle
  # kept-alive one included. The next is closed right after its header with
  # no HTTP answer, and the backend logs only how many it refused, never an
  # address. Passed as RECEIVE_CONNECTIONS_PER_ADDRESS (templates/backend.yaml);
  # anything but 0 or a whole number stops the backend from starting. 0 turns
  # the bound off: the one-line recovery, which every CI check passes on, and
  # what must be set before Traefik's policy is reverted to Cluster, where
  # every sender becomes 10.42.0.1 and would share one count (runbook
  # section 7). Counted per backend process, so twice during a rollout's
  # overlap (D221).
  connectionsPerAddress: 512

backend:
  port: 3000
  # The trust boundary, as a comma-separated list of IP addresses or CIDR
  # ranges (D111): the peers whose PROXY protocol header the receive listener
  # accepts, and so who decides a capture's sender address (D187), and the
  # peers whose X-Forwarded-For the application listener believes. Never a hop
  # count and never "everyone": there is no form here that expresses either.
  #
  # 10.42.0.0/24 is this node's pod network, so what it trusts is **every pod
  # on this node**, not the Traefik pod alone — a pod IP is not stable enough
  # to name. It is also **per-node**: a second node gets a range of its own and
  # this list would silently stop matching the peer that forwards, after which
  # proxy addresses would be stored again. The single-node cluster is what makes
  # the approximation acceptable, and that is an assumption with an expiry date,
  # not a property of the design (D111). Adding a node means widening this value
  # in the same change (runbook section 4).
  #
  # Safe to set since 2026-09-21, and it was not before. Traefik now runs
  # externalTrafficPolicy: Local (deploy/cluster/traefik-config.yaml), and the
  # Stage 0 header probe re-run afterwards saw the prober's real public address
  # arrive in X-Forwarded-For and X-Real-Ip, with a forged value still stripped
  # (D130). While the policy was Cluster those headers carried 10.42.0.1, and
  # filling this in would only have stored a private address through a path the
  # code considers trusted (D118).
  #
  # **Rollback order, which is the part that matters:** empty this value and
  # deploy *before* reverting the Traefik policy. The reverse order leaves the
  # backend trusting an X-Forwarded-For that again carries 10.42.0.1 and storing
  # it as a verified sender (runbook section 7).
  #
  # Empty means the backend ignores forwarding headers entirely and records the
  # socket peer, which is what local development runs. With
  # receive.proxyProtocol v2 the backend refuses to start on an empty value.
  trustedProxyCidrs: '10.42.0.0/24'
  # The kernel's receive buffer for the backend pod's TCP sockets, as
  # `net.ipv4.tcp_rmem`'s three numbers in bytes - the least, the size a new
  # socket starts with, the most the kernel grows it to - set as a sysctl of
  # the pod's own network namespace (templates/backend.yaml), never the
  # node's (#217, amending D238 points 7, 9 and 10). Linux's default starts a
  # socket at 131,072 bytes; a connection the receive host holds unread for
  # its header lines (D238) never grows its buffer, so what it costs the
  # backend is that start plus the one read put back in front of it. 16,384
  # bytes cut that cost so that the floods of held connections are survived
  # from more addresses (measured, D238's amendment of 2026-10-21). A socket
  # the backend reads fast still grows to the same 6 MiB. A safe sysctl since
  # Kubernetes 1.32, allowed by the kubelet without any node setting. Empty
  # drops it, and the pod has Linux's default again.
  tcpRmem: '4096 16384 6291456'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  port: 80
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

postgres:
  image: postgres
  # Pinned separately from the application images and bumped by hand when
  # deploy/postgres/Dockerfile changes. Tagging the database with every commit
  # SHA would restart it on every deployment.
  tag: '16-pgcron-1'
  # The role and the database, created when the volume is first initialised;
  # changing them later does not rename an existing database.
  user: inspector
  database: inspector
  port: 5432
  # The password is not held in this file or in the release. Create the secret
  # once, before the first install; empty is <release>-postgres:
  #   kubectl -n <namespace> create secret generic <release>-postgres \
  #     --from-literal=password="$(openssl rand -hex 24)"
  # Hex keeps it free of characters that would need escaping inside the
  # connection URL the backend receives.
  existingSecret: ''
  secretKey: password
  storage:
    size: 20Gi
    # Empty means the cluster default, which on k3s is local-path (D085).
    className: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Nightly database backup (D176; the backup and restore runbook is the
# operator's, kept outside this repository): a CronJob that dumps
# postgres.database into a directory on the node, checks that each dump
# restores, and keeps the newest few. Always on; the off-server copy below is
# an option.
backup:
  # 03:00 in Moscow, between the night deliveries at 02:00 and 04:00, neither of
  # which restarts PostgreSQL.
  schedule: '0 3 * * *'
  timeZone: Europe/Moscow
  # A directory on the node, outside the namespace, so it survives the
  # namespace's removal. It must exist before the install, owned by 999:999
  # with mode 0700 (README.md); the pod fails to start if it is missing. Only
  # this directory is mounted, so whatever its parent holds is out of reach.
  hostPath: /var/backups/webhook-inspector
  # Dumps kept, counted rather than aged: while runs keep failing, the last good
  # dumps stay until the failure is fixed (D176).
  keep: 3
  # A run stops before writing anything when the filesystem holding hostPath
  # has less free space than this, in GiB (1024³ bytes, what `df -h` shows as
  # G). A full disk stops the node (D085).
  minFreeGiB: 10
  # The scratch server's data directory. A restore needs about the database's
  # size here; the database is about 10 MB today (2026-09-27).
  scratchSizeLimit: 2Gi
  # Modest: the node's 2 cores and 4 GB are serving production meanwhile.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The off-server copy (D190, the backup and restore runbook), off unless a
  # bucket is set: each run encrypts the dump it has saved and checked to the
  # public key in recipientKey, whose private half only its holder has, and
  # an uploader beside the backup in its pod puts that copy into the bucket and
  # prunes the bucket to `keep` copies, as the directory on the node.
  offsite:
    # Empty, the default, turns the off-server copy off: the pod has no
    # uploader, nothing is encrypted, and the backup runs on its own. Set, the
    # endpoint, the region and recipientKey must be set too, or the chart
    # refuses to render, naming the one missing.
    bucket: ''
    # Any S3-compatible storage that takes path-style requests signed with
    # Signature Version 4: its https:// endpoint and its region.
    endpoint: ''
    region: ''
    # The OpenPGP public key, ASCII-armored, the copies are encrypted to, given
    # with --set-file backup.offsite.recipientKey=<file>. Not a secret; the
    # private key never comes near the cluster.
    recipientKey: ''
    # The static access key is not held in this file or in the release. The
    # installer creates the Secret, keys access-key-id and secret-access-key,
    # before the first run; it is never printed. Empty is
    # <release>-offsite-backup. With the bucket set and the Secret missing, the
    # run fails and says so.
    existingSecret: ''
    # Each run reads the bucket's versioning and uploads nothing while it is
    # enabled, because a delete would then leave the old versions in place.
    # false only for a key that is refused that read; the operator then checks
    # the setting in the console instead (the runbook's section 7).
    checkVersioning: true

# Alerts (D181; the alerts runbook is the operator's, kept outside this
# repository), off unless a heartbeat URL is set: a heartbeat service alerts
# its owner when a heartbeat reports a failure or stops coming. The monitor
# CronJob sends `site` and `disk` every 5 minutes, and a notifier in the
# backup pod sends `backup` after each backup. The monitors, their intervals
# and grace times live in that service, not here.
alerts:
  # The heartbeat endpoint: a POST to <heartbeatUrl>/<token> reports a
  # success, and to <heartbeatUrl>/<token>/fail a failure; any service taking
  # those two does. Empty, the default, renders neither the monitor nor the
  # backup's notifier.
  heartbeatUrl: ''
  # The tokens are not held in this file or in the release. The installer
  # creates the Secret, keys site, disk and backup, one token each; the token
  # is the credential and is never printed. Empty is <release>-heartbeat.
  existingSecret: ''
  # Probed by its public name, so the check passes through DNS, Traefik, TLS,
  # the frontend, the backend and the database, as a visitor's request does.
  # Empty is https://<ingress.host>.
  siteUrl: ''
  # The receive host is probed too, by its public name and through its own TCP
  # route, so that capture never leaves the monitored path (D187). Its origin
  # is composed from receive.host.
  # Every 5 minutes; a heartbeat expected every 10 with 5 minutes' grace
  # tolerates one missed run and alerts on silence after about 15 minutes.
  schedule: '*/5 * * * *'
  # The node's local-path directory, which holds the database volume (D085).
  # Its filesystem's usage is what is checked; it is mounted read-only.
  diskPath: /var/lib/rancher/k3s/storage
  # `disk/fail` at or above this percentage in use, as `df` rounds it; below
  # the backup's 10 GiB free-space guard, which is about 83 % of the 59 GB disk.
  diskThresholdPercent: 80
  # For the monitor and the backup's notifier alike: one small Node process.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
