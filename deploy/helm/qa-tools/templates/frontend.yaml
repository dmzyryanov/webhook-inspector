apiVersion: v1
kind: Service
metadata:
  name: {{ include "qa-tools.name" . }}-frontend
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qa-tools.name" . }}-frontend
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  # Stated rather than left to Kubernetes' default: the new pod starts and is
  # ready before the old one is told to stop, and none is unavailable meanwhile
  # (D221, amending D088's "the frontend keeps the default rolling update").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "qa-tools.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      # The preStop pause, 10 s, and nginx's graceful stop after it.
      terminationGracePeriodSeconds: 30
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ .Values.images.registry }}/{{ .Values.images.frontend }}:{{ include "qa-tools.imageTag" . }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          # Before the pod is stopped: the pause lets Traefik drop the
          # terminating pod from its endpoints while nginx still serves, so no
          # request reaches it after it has stopped accepting (D221).
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '10']
          # Nginx answers this itself, so it reports whether the container can
          # serve files, which is all this pod does (D086).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Every 2 s, so that the new pod takes over without waiting 10 s
          # (D221); 15 failures in a row take it out.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
