apiVersion: v1
kind: Service
metadata:
  name: {{ include "qa-tools.postgresHost" . }}
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # A plain ClusterIP rather than a headless Service: the backend addresses the
  # database by Service name, and nothing needs per-pod DNS for a single
  # instance. PostgreSQL is never exposed through the Ingress.
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "qa-tools.postgresHost" . }}
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "qa-tools.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "qa-tools.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.images.registry }}/{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_cron
            - -c
            - cron.database_name={{ .Values.postgres.database }}
            # Without background workers pg_cron opens a new libpq connection
            # per run, which then has to pass pg_hba authentication and fails
            # silently while the job still looks healthy in cron.job.
            - -c
            - cron.use_background_workers=on
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
            # initdb refuses a directory that is not empty, and a freshly
            # mounted volume contains lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        {{- if .Values.postgres.storage.className }}
        storageClassName: {{ .Values.postgres.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
