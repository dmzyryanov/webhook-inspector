apiVersion: v1
kind: Service
metadata:
  name: {{ include "qa-tools.name" . }}-backend
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
    # The receive listener (D187), reached only by Traefik's TCP route for the
    # receive host (templates/receive.yaml), never by the Ingress.
    - name: receive
      port: {{ .Values.receive.port }}
      targetPort: receive
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qa-tools.name" . }}-backend
  labels:
    {{- include "qa-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Exactly one outside a rollout (#132, Decision 2). Events reach the viewers
  # of every backend process through the outbox in PostgreSQL (D221), so two
  # processes may serve side by side; the per-address limits are per process.
  replicas: 1
  # Rolled since 0.54.1 (#132, D221, amending D088): the new pod starts, its
  # init container migrates while the old pod serves - so every migration must
  # be safe for the previous image to serve on (D151 note) - and it is ready
  # before the old one is told to stop, which then pauses, drains and stops
  # below. None is unavailable meanwhile, and for those seconds two backend
  # processes serve. A rollback to a revision before 0.54.1 applies that
  # revision's Recreate once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "qa-tools.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      # The preStop pause, 10 s, then up to 30 s for a webhook whose reply a
      # configured delay holds (MAX_RESPONSE_DELAY_MS) and for the shutdown
      # after it, with room to spare (D221).
      terminationGracePeriodSeconds: 60
      # A smaller kernel receive buffer for this pod's TCP sockets, at the
      # pod's level as a sysctl must be: it is the pod's network namespace's,
      # so no other pod and not the node have it (#217, D238). What a
      # connection held unread for its header lines costs is mostly that
      # buffer; see backend.tcpRmem in values.yaml.
      {{- with .Values.backend.tcpRmem }}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_rmem
            value: {{ . | quote }}
      {{- end }}
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      initContainers:
        # Migrations run from the same image that will serve traffic, before it
        # starts, so the schema a release expects is applied by the release
        # itself. The runner records applied names, so repeating it is safe, and
        # it fails loudly while the database is unreachable — which is also how
        # this container waits for it.
        - name: migrate
          image: {{ .Values.images.registry }}/{{ .Values.images.backend }}:{{ include "qa-tools.imageTag" . }}
          command: ['node', 'src/db/migrate.ts']
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "qa-tools.postgresSecret" . }}
                  key: {{ .Values.postgres.secretKey }}
            - name: DATABASE_URL
              value: {{ include "qa-tools.databaseUrl" . | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      containers:
        - name: backend
          image: {{ .Values.images.registry }}/{{ .Values.images.backend }}:{{ include "qa-tools.imageTag" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "qa-tools.postgresSecret" . }}
                  key: {{ .Values.postgres.secretKey }}
            - name: DATABASE_URL
              value: {{ include "qa-tools.databaseUrl" . | quote }}
            - name: BACKEND_HOST
              value: '0.0.0.0'
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
            # Empty in the chart's defaults, which means no peer's
            # forwarding headers are believed; this deployment sets the node's
            # pod network, so the in-cluster Traefik pod is trusted and the
            # stored address is the original sender's (D111, D130). See the
            # comment on backend.trustedProxyCidrs in values.yaml for what that
            # range really trusts and for the rollback order.
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.backend.trustedProxyCidrs | default "" | quote }}
            # The receive listener (D187): its port, the PROXY protocol header
            # Traefik's TCP route puts in front of every connection, and the
            # public origin every receiveUrl names.
            - name: RECEIVE_PORT
              value: {{ .Values.receive.port | quote }}
            - name: RECEIVE_PROXY_PROTOCOL
              value: {{ .Values.receive.proxyProtocol | quote }}
            # At most this many connections open at once from one sender
            # address, counted by the PROXY layer; 0 turns the bound off (D227).
            - name: RECEIVE_CONNECTIONS_PER_ADDRESS
              value: {{ .Values.receive.connectionsPerAddress | quote }}
            - name: RECEIVE_ORIGIN
              value: {{ printf "https://%s" (include "qa-tools.receiveHost" .) | quote }}
            # The site's own origin (D203): the inspector links /mcp gives,
            # and an Origin a browser may send it.
            - name: APP_ORIGIN
              value: {{ printf "https://%s" (include "qa-tools.host" .) | quote }}
            {{- if .Values.ingress.aliasHost }}
            # The site's second origin (D275): the other Origin a browser may
            # send /mcp. It builds no link.
            - name: APP_ALIAS_ORIGIN
              value: {{ printf "https://%s" .Values.ingress.aliasHost | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
            # No probe here: a kubelet probe carries no PROXY header and would
            # be refused. The pod is ready only after this port opens, because
            # the backend opens it before the application port (D187).
            - name: receive
              containerPort: {{ .Values.receive.port }}
          # Before the pod is stopped: SIGUSR2 starts the drain - every answer
          # from then on closes its connection - and the pause lets Traefik
          # drop the terminating pod from its endpoints before the process
          # stops accepting, on SIGTERM afterwards (lifecycle.ts, D221). Node
          # is PID 1 in the image and handles SIGUSR2.
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'kill -USR2 1; sleep 10']
          # Liveness deliberately does not reach the database; readiness does
          # (D086), and waits for the realtime listener's first read (D221).
          # A busy process is not a dead one (#205, D264): an answer within
          # 5 s passes, and only 6 failures in a row restart the pod, so a
          # process that answers within a few seconds is never restarted,
          # and one that does not answer at all is restarted within
          # 15 + 5 x 15 + 5 = 95 s of falling silent. Kubernetes' defaults,
          # 1 s and 3, restarted the backend five times on 2026-10-15 while
          # it was busy refusing a flood.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          # Every 2 s, so that a new pod is taken into the Service within
          # about 2 s of being able to serve, not 10 (D221); 15 failures in a
          # row, 30 s, take it out, as 3 failures 10 s apart did before.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
