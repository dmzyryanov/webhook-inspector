# The header-only query measurement of issue #130 (D250),
# driven by `node scripts/measure-header-queries.mjs run`, which starts this
# project afresh for each shape of stored headers - a new database volume,
# migrated, a new backend - and removes everything it started.
#
# The backend image built from this checkout and limited as the chart limits
# it, 0.5 CPU and 512 MiB with no swap; PostgreSQL of the project's own image
# with the chart's 1 CPU and 1 GiB, its data on a volume of its own rather
# than in memory, as production's is on a disk. No Traefik: the client calls
# the backend straight and is a peer the backend trusts
# (`TRUSTED_PROXY_CIDRS`), so the `X-Forwarded-For` of each API call names
# the simulated caller's own address, and the per-address limits count every
# caller apart. Webhooks reach the receive listener without a PROXY header
# (`RECEIVE_PROXY_PROTOCOL` off), from the client's own address.
#
# Nothing is published on the host, and nothing is pulled: every image but
# the backend's, which is built, must be present already (`pull_policy`).
# MEASURE_BACKEND_IMAGE names another backend image already built. Its own
# name and subnet, so it never meets another measurement's project.
name: dev130-measure

services:
  postgres:
    image: webhook-inspector-postgres
    pull_policy: never
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: webhook_inspector
      POSTGRES_PASSWORD: webhook_inspector
      POSTGRES_DB: webhook_inspector
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=webhook_inspector
      - -c
      - cron.use_background_workers=on
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'psql -h 127.0.0.1 -U webhook_inspector -d webhook_inspector -tAc "SELECT 1"']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      load:
        ipv4_address: 10.130.0.4

  migrate:
    image: ${MEASURE_BACKEND_IMAGE:-dev130-measure-backend}
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      pull: false
    pull_policy: missing
    command: ['node', 'src/db/migrate.ts']
    environment:
      DATABASE_URL: postgres://webhook_inspector:webhook_inspector@postgres:5432/webhook_inspector
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      load:
        ipv4_address: 10.130.0.5

  backend:
    image: ${MEASURE_BACKEND_IMAGE:-dev130-measure-backend}
    pull_policy: never
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      DATABASE_URL: postgres://webhook_inspector:webhook_inspector@postgres:5432/webhook_inspector
      # The client, which names each caller itself.
      TRUSTED_PROXY_CIDRS: 10.130.0.10/32
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 1s
      timeout: 3s
      retries: 60
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      load:
        ipv4_address: 10.130.0.3

  client:
    image: node:24-slim
    pull_policy: never
    command: ['sleep', 'infinity']
    init: true
    # The repository, read-only: the client runs the script from it.
    volumes:
      - ..:/repo:ro
    networks:
      load:
        ipv4_address: 10.130.0.10

volumes:
  data:

networks:
  load:
    ipam:
      config:
        - subnet: 10.130.0.0/24
