# Serves the built frontend. The Ingress sends /api/, /ws/ and /s/ to the
# backend, each by its whole path segment (D047, D183), so everything that
# arrives here is the application's: bare /api, /ws and /s, /sxyz or
# /sitemap.xml included.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A viewer opens /v/<session-id>, and the session id is the access key to a
    # session (D004), so an access log here would record exactly the value the
    # backend takes care to shorten before logging (D059). The backend already
    # logs every API and webhook request with the id redacted, which is where
    # request-level observability belongs.
    access_log off;

    # X-Robots-Tag of the answer, set only by the session location below, so
    # that a session page is never indexed (D183). Every request starts with
    # it empty, and add_header sends no header with an empty value: / and every
    # other address carry none. An error_page redirect starts the request
    # again from here, so a 404 is never marked either.
    set $robots_tag '';

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 text/markdown application/atom+xml;
    gzip_min_length 1024;

    # Answers the readiness probe without serving the application.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The public OpenAPI description of the API (D154), written into the build
    # from packages/shared/openapi.json under the image's origins (D274). Its
    # own location, so it is always JSON and never the application shell: a
    # missing file is nginx's plain 404, not index.html. It changes with every
    # release, so a client revalidates it rather than keeping a copy.
    location = /openapi.json {
        types { }
        default_type application/json;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The agent-readable documentation (D165): llms.txt, the index an agent
    # fetches first, and llms-full.txt, the whole guide, both written into the
    # build by scripts/build-llms.mjs. Exact locations of their own, so each is
    # always Markdown and never the application shell: a missing file is
    # nginx's plain 404. `charset_types` because text/markdown is not among the
    # types `charset` labels by default. Revalidated on every use, like
    # /openapi.json, since llms-full.txt changes with every release.
    location = /llms.txt {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # security.txt (RFC 9116, D177), written into the build by
    # scripts/build-security-txt.mjs with an Expires under a year after the
    # build. RFC 9116 asks for text/plain with charset=utf-8, which `location /`
    # would not add, so it has an exact location of its own; a missing file is
    # nginx's plain 404, not the application shell. nginx refuses no
    # dot-directory, so /.well-known/ needs nothing more. Revalidated on every
    # use, since each deployment moves Expires.
    location = /.well-known/security.txt {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The relay script (D202) under its new name (D275), which
    # scripts/build-site-files.mjs writes into the build from
    # public/webhook-inspector-relay.mjs, reading the site's second origin by
    # default, under the build's origins (D274): a file people download, check
    # against the SHA-256 /docs gives, read and run with node. An exact
    # location of its own, so it is always itself as UTF-8 JavaScript
    # (text/javascript, RFC 9239) whatever the mime table says, and a missing
    # file is nginx's plain 404, never the application shell. Revalidated on
    # every use, like /openapi.json, so that a release's file and the hash
    # /docs gives for it reach a reader together.
    location = /webhook-inspector-relay.mjs {
        types { }
        default_type text/javascript;
        charset utf-8;
        charset_types text/javascript;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The same file under its old name until the date the changelog gives
    # (D275), byte for byte since 1.19.0 (D279), which
    # scripts/build-site-files.mjs writes into the build from the same source:
    # served the same way.
    location = /qa-tools-relay.mjs {
        types { }
        default_type text/javascript;
        charset utf-8;
        charset_types text/javascript;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The API reference (D155): a static page of its own, built by
    # vite.docs.config.ts into docs/index.html, that renders /openapi.json with
    # Scalar. It is not the application and never its shell, so it has its own
    # exact locations rather than falling through to `location /`. Its scripts
    # and styles live under /assets/ with the application's, cached for a year
    # by content hash; the page itself is revalidated on every use, so a
    # deployment reaches a reader at once.
    location = /docs {
        rewrite ^ /docs/index.html last;
    }

    location = /docs/ {
        rewrite ^ /docs/index.html last;
    }

    # Reached only through the two locations above. Asked for by name it is an
    # unknown address like /index.html: 404, with the application as the page
    # (D146).
    location = /docs/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The changelog (D184): a static page of its own like /docs, built by
    # vite.changelog.config.ts into changelog/index.html from CHANGELOG.md, with
    # exact locations for /changelog and /changelog/ rather than `location /`,
    # so it is never the application shell. Its script, styles and fonts live
    # under /assets/, cached for a year by content hash; the page is
    # revalidated on every use, so a release reaches a reader at once. It sets
    # no X-Robots-Tag: search engines are offered it (sitemap.xml).
    location = /changelog {
        rewrite ^ /changelog/index.html last;
    }

    location = /changelog/ {
        rewrite ^ /changelog/index.html last;
    }

    # Reached only through the two locations above; asked for by name it is an
    # unknown address: 404, with the application as the page (D146).
    location = /changelog/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The changelog's text for scripts and agents (D184), written into the
    # build by scripts/build-changelog.mjs. Served like llms.txt: always UTF-8
    # Markdown, revalidated on every use, and a missing file is nginx's plain
    # 404, never the application shell.
    location = /changelog.md {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The changelog's two Atom feeds (RFC 4287, D212), written into the build
    # by scripts/build-changelog.mjs: every version, and only the versions
    # whose entry has a Breaking, Deprecated or Notice paragraph. Served like
    # /changelog.md: always UTF-8 Atom, revalidated on every use, and a missing
    # file is nginx's plain 404, never the application shell. `charset_types`
    # because application/atom+xml is not among the types `charset` labels by
    # default. A neighbour such as /changelog.xmll is an unknown address like
    # any other: 404 with the application as the page (D146).
    location = /changelog.xml {
        types { }
        default_type application/atom+xml;
        charset utf-8;
        charset_types application/atom+xml;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    location = /changelog-breaking.xml {
        types { }
        default_type application/atom+xml;
        charset utf-8;
        charset_types application/atom+xml;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }

    # The about page (D211): a static page of its own like /changelog, built
    # by vite.about.config.ts into about/index.html from
    # src/lib/about-copy.ts, with exact locations for /about and /about/
    # rather than `location /`, so it is never the application shell. Its
    # stylesheet and fonts live under /assets/, cached for a year by content
    # hash; the page is revalidated on every use, so a release reaches a
    # reader at once. It sets no X-Robots-Tag: search engines are offered it
    # (sitemap.xml).
    location = /about {
        rewrite ^ /about/index.html last;
    }

    location = /about/ {
        rewrite ^ /about/index.html last;
    }

    # Reached only through the two locations above; asked for by name it is an
    # unknown address: 404, with the application as the page (D146).
    location = /about/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The about page in Russian (D255): built beside it by the same
    # vite.about.config.ts into ru/about/index.html from
    # src/lib/about-copy-ru.ts, and served the same way: exact locations for
    # /ru/about and /ru/about/, never the application shell, revalidated on
    # every use, no X-Robots-Tag (sitemap.xml lists it). Like /about it is
    # the page whatever Accept-Language asks for: no negotiation, no redirect.
    # nginx matches the decoded, slash-merged path, so /ru//about is this page
    # too; /RU/about and /ru/about.html are unknown addresses.
    location = /ru/about {
        rewrite ^ /ru/about/index.html last;
    }

    location = /ru/about/ {
        rewrite ^ /ru/about/index.html last;
    }

    # Reached only through the two locations above; asked for by name it is an
    # unknown address: 404, with the application as the page (D146).
    location = /ru/about/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The Terms of Use and the Privacy Policy (D217): two static pages built
    # like /about, by vite.legal.config.ts into terms/index.html and
    # privacy/index.html from src/lib/legal-copy.ts, and served the same way:
    # exact locations for the address with and without its slash, never the
    # application shell, revalidated on every use, no X-Robots-Tag (both are
    # in sitemap.xml).
    location = /terms {
        rewrite ^ /terms/index.html last;
    }

    location = /terms/ {
        rewrite ^ /terms/index.html last;
    }

    # Reached only through the two locations above; asked for by name it is an
    # unknown address: 404, with the application as the page (D146).
    location = /terms/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    location = /privacy {
        rewrite ^ /privacy/index.html last;
    }

    location = /privacy/ {
        rewrite ^ /privacy/index.html last;
    }

    # As /terms/index.html.
    location = /privacy/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The Russian home page (D226): the application itself with a head of its
    # own - lang="ru", the Russian title and description, its canonical
    # address and the hreflang pair - built by vite.config.ts into
    # ru/index.html beside index.html, loading the same script. Exact
    # locations for /ru/ and /ru, as /about has, so it is never
    # `location /`'s: that would answer /ru/ without Cache-Control and
    # /ru/index.html by name with 200. Revalidated on every use like the
    # shell, no X-Robots-Tag: search engines are offered it (sitemap.xml).
    # nginx matches the decoded, slash-merged path, so //ru// and /%72u/
    # are this page too, and the client reads them the same way
    # (classifyAddress); /RU/, /ru/x and /ru/v/<id> are unknown addresses.
    location = /ru {
        rewrite ^ /ru/index.html last;
    }

    location = /ru/ {
        rewrite ^ /ru/index.html last;
    }

    # Reached only through the two locations above; asked for by name it is an
    # unknown address: 404, with the application as the page (D146).
    location = /ru/index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        error_page 404 /index.html;
    }

    # The public status page (D209) is Statuser's, at its own host: /status and
    # /status/ send a reader there with a 301, in exact locations of their own
    # like /docs. The target is a fixed absolute URL, so nothing of the request
    # reaches the Location: not its host or scheme, which absolute_redirect,
    # port_in_redirect and server_name_in_redirect apply only to a relative
    # target, and not its query string, which `return`, unlike `rewrite`, never
    # appends. Any other address under /status is the application's 404.
    location = /status {
        return 301 https://status.qa-tools.ru/;
    }

    location = /status/ {
        return 301 https://status.qa-tools.ru/;
    }

    # Vite fingerprints these filenames, so a given URL never changes contents
    # and may be cached indefinitely. A missing asset stays nginx's plain 404:
    # it is never answered with the application shell, and the 404 status is
    # what makes the tag that asked for it fail.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }

    # The application shell. It is reached only through the locations below,
    # never by its own name, so every answer that carries it passes through
    # here and gets the same header.
    #
    # index.html must not be cached, or a browser would keep loading the
    # previous release's asset names after a deployment. `always`, because the
    # shell is also the body of every 404 below: a 404 is heuristically
    # cacheable, and add_header skips a non-2xx/3xx answer without it.
    #
    # Asked for by name, /index.html is an unknown address like any other: the
    # internal location refuses it with 404, and the error page is the shell.
    #
    # X-Robots-Tag is written here, beside Cache-Control, and not in the
    # session location: its rewrite leaves that location, and with it any
    # add_header there. A location that declares add_header inherits none from
    # an outer level, so both headers of the shell have to be in this one.
    location = /index.html {
        internal;
        add_header Cache-Control 'no-cache' always;
        add_header X-Robots-Tag $robots_tag always;
        error_page 404 /index.html;
    }

    # The two kinds of address the application's shell serves with 200 (D146):
    # the landing page, and an address shaped like a session. Whether that
    # session exists is the API's answer, not nginx's, so a well-formed id is
    # always 200 and the page asks. The Russian home page, /ru/, is the third
    # address the application answers 200, from its own head above (D226).
    location = / {
        rewrite ^ /index.html last;
    }

    # Keep this pattern in step with SESSION_ID_PATTERN in
    # packages/shared/src/index.ts. apps/frontend/src/lib/not-found.test.ts reads
    # it from this file and fails when the two differ. nginx matches the decoded
    # path with repeated slashes merged, and the client reads it the same way.
    #
    # `\z`, not `$`: in PCRE `$` also matches before a final newline, and nginx
    # decodes `%0A`, so `$` would serve /v/<id>%0A with 200 while the client,
    # whose `$` does not, renders `Page not found` for it.
    #
    # The session id is the access key to a session (D004), so every answer
    # here carries `X-Robots-Tag: noindex` (D183): the value is set before the
    # rewrite, from the address this location matched, and the shell's
    # location sends it. Set here rather than mapped from $request_uri, which
    # is the raw address - percent-escapes and repeated slashes as sent - so
    # a map would miss a session address this location serves with 200, such
    # as /v/%41<42 more characters>.
    location ~ "^/v/[A-Za-z0-9_-]{43}/?\z" {
        set $robots_tag noindex;
        rewrite ^ /index.html last;
    }

    # Every other address is one the application does not serve. A file that
    # exists is still served as a file - among them, from public/ (D183),
    # /robots.txt and /sitemap.xml, which scripts/build-site-files.mjs writes
    # into the build under the build's origins, byte for byte under
    # production's (D274), and /favicon.ico and the two logo images, copied
    # into it as they are - and anything else answers 404 with the
    # application as its body, so the page can say what happened (D146).
    # `error_page` without `=` keeps the 404.
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }
}
